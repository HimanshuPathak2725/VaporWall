name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          default: false
      - name: Install bpf-linker
        run: cargo install bpf-linker
      - uses: Swatinem/rust-cache@v2
      - name: Build eBPF bytecode
        # Required before building/clippy-ing vaporwall: it embeds this
        # bytecode at compile time via include_bytes_aligned!, so the file
        # must already exist on disk before vaporwall is touched at all.
        run: cargo run -p xtask -- build-ebpf
      - run: cargo clippy --workspace --exclude vaporwall-ebpf --all-targets --all-features -- -D warnings
      - name: Clippy (eBPF crate, its own target)
        run: cd vaporwall-ebpf && cargo clippy -- -D warnings

  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          default: false
      - name: Install bpf-linker
        run: cargo install bpf-linker
      - uses: Swatinem/rust-cache@v2
      - name: Build eBPF bytecode
        run: cargo run -p xtask -- build-ebpf
      - run: cargo build --workspace --exclude vaporwall-ebpf --verbose
      - run: cargo test --workspace --exclude vaporwall-ebpf --verbose

  # eBPF programs must be verified/loaded on Linux with elevated capabilities.
  # This job is a placeholder — enable once there's something to attach and
  # a safe, self-contained target (e.g. a loopback interface or a synthetic
  # packet source) to test against in CI.
  # ebpf-smoke-test:
  #   name: eBPF load/attach smoke test
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: sudo ./scripts/ci-smoke-test.sh
